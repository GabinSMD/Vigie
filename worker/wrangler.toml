# Worker Vigie : sert l'app (static assets de dist/) et l'API de lecture seule (/api/*), sur un seul nom d'hôte.
# Les valeurs ci-dessous sont FACTICES : rien n'est déployé tant que tu ne les remplaces pas.
# Le plus simple : `npm run mise-en-route` à la racine du dépôt les remplace pour toi.
# Guide pas à pas : docs/mise-en-route.md

name = "vigie-api"
main = "src/index.ts"
compatibility_date = "2025-06-01"

# Pas d'adresse *.workers.dev ni d'URL d'aperçu : Vigie n'est joignable que derrière Cloudflare Access.
workers_dev = false
preview_urls = false

# Domaine personnalisé : tout le nom d'hôte (l'app et /api/*). Cloudflare Access protège l'ensemble.
# Ton sous-domaine et ta zone (décision D9), écrits par la mise en route (étape cloudflare).
routes = [
  { pattern = "vigie.gabin-simond.fr", zone_name = "gabin-simond.fr", custom_domain = true }
]

# Cloudflare Access (variables, pas des secrets) : le Worker vérifie le JWT `Cf-Access-Jwt-Assertion`
# sur /api/ordres avec les clés de ton équipe Access et l'audience de l'application « Vigie ».
# ACCESS_ALLOWED_EMAIL : la seule adresse qui peut répondre (D2) ; ACCESS_PILOT_CLIENT_ID : Client ID du jeton
# de service du pilote. À REMPLACER : la mise en route les écrit (étape ordres). Tant qu'elles sont factices, /api/ordres répond 401 ou 403.
[vars]
ACCESS_TEAM_DOMAIN = "a-remplacer.cloudflareaccess.com"
ACCESS_AUD = "a-remplacer"
ACCESS_ALLOWED_EMAIL = "a-remplacer@example.org"
ACCESS_PILOT_CLIENT_ID = "a-remplacer.access"

# Garde routes, workers_dev, etc. AU-DESSUS de [vars] et de [assets] : en TOML, une clé placée dessous irait dans [assets].
# L'app est construite dans ../dist (`npm run build` à la racine, avec VITE_API_URL=/).
# run_worker_first : chaque requête passe par le Worker, qui garde /api/* et renvoie le reste à ASSETS.
[assets]
directory = "../dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[kv_namespaces]]
binding = "VIGIE_SNAPSHOT"
# À REMPLACER : l'identifiant rendu par `npx wrangler kv namespace create VIGIE_SNAPSHOT`.
id = "b81d07e1897b44df8ae8d12cd6ce9ba2"

[[d1_databases]]
binding = "VIGIE_DB"
database_name = "vigie"
# À REMPLACER : l'identifiant rendu par `npx wrangler d1 create vigie` (la mise en route le fait).
database_id = "00000000-0000-0000-0000-000000000000"
# Tables des ordres et du journal : `npx wrangler d1 migrations apply vigie --remote`.
migrations_dir = "migrations"

# SECRETS : ne jamais les écrire ici. Pose-les avec `npx wrangler secret put <NOM>` :
#   GITHUB_APP_ID            identifiant numérique de la GitHub App « Vigie »
#   GITHUB_APP_PRIVATE_KEY   clé privée de l'App, au format PKCS#8 (voir le guide)
#   GITHUB_INSTALLATIONS     JSON : {"GabinSMD": 111, "SIMOND-ANCE-BROS": 222, "DentiSync": 333}
#                            (identifiant d'installation de l'App sur chaque compte)
#   PILOT_TOKEN              jeton porteur du pilote pour GET et PATCH /api/ordres (32 octets aléatoires ;
#                            la même valeur va dans les secrets de l'environnement du pilote)
