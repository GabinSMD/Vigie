name: Strip platform footer

# The Claude Code cloud platform appends "_Generated by [Claude Code](…)_" to
# PR descriptions server-side and puts it back after a session removes it
# (seen on #27). The shared workflow removes it with the workflow token (#28).
# Not a required check: it is skipped on PRs without the footer.

on:
  pull_request:
    types: [opened, edited]

permissions: {}

concurrency:
  group: strip-platform-footer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  strip:
    # Write access to PR descriptions on this job only. On a PR from a fork,
    # GitHub hands `pull_request` a read-only token whatever is asked here: the
    # edit is refused and the run shows as failed (harmless, not required).
    permissions:
      pull-requests: write
    # Pinned by commit SHA: shared-workflows has no tags, so the comment names
    # the branch and the commit date. Bump it by hand to pick up changes.
    uses: GabinSMD/shared-workflows/.github/workflows/strip-platform-footer.yml@7f6f805797cf317bcb0b668f0493abbee56c9234 # main 2026-11-25
